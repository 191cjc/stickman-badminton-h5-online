# Include only in the existing www.firesoul.cn HTTPS server block.
# All locations are owned by this independent project.
location = /badminton-h5-online {
    absolute_redirect off;
    return 308 /badminton-h5-online/;
}

location = /badminton-h5-online/ws {
    proxy_pass http://127.0.0.1:8794;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;
    proxy_buffering off;
}

location ^~ /badminton-h5-online/api/ {
    proxy_pass http://127.0.0.1:8794;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /badminton-h5-online/assets/ {
    alias /opt/stickman-badminton-h5-online/current/dist/client/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /badminton-h5-online/ {
    alias /opt/stickman-badminton-h5-online/current/dist/client/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; connect-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; frame-ancestors 'self'" always;
}
